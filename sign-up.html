<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Financial Tracker</title>
    <link rel="stylesheet" href="sign-up.css">
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-content">
                <div class="signup-header">
                    <div class="logo">💰</div>
                    <h1>Create your account</h1>
                    <p class="subtitle">Start tracking your money smarter</p>
                </div>

                <form id="signupForm" class="signup-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="Your name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Create a password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>

                <div class="signup-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="db.js"></script>
    <script>
    (function() {
      if (localStorage.getItem('isLoggedIn') === 'true') {
        window.location.replace('index.html');
        return;
      }
      document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim() || 'User';
        const email = document.getElementById('email').value.trim().toLowerCase();
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userName', name);
        (async function() {
          const apiOk = await (window.API ? API.upsertUserProfile(email, name) : null);
          if (!apiOk) DB.upsertUserProfile({ email, name });
        })();
        window.location.replace('index.html');
      });
    })();
    </script>
</body>
</html>
